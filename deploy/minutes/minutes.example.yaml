# Shared schema for checkpoint minutes config and spec.minutes in target YAML.
enabled: true
language: ru
confirmationSeconds: 7200
warningSeconds: 300
emptySeconds: 60
maxConcurrentRecordings: 2
maxSources: 32
minFreeBytes: 2147483648
maxStorageBytes: 21474836480
failedAudioTTLSeconds: 604800
transcription:
  adapter: faster-whisper
  language: auto
  threads: 2
generator:
  adapter: local
  endpoint: http://127.0.0.1:18089/v1/chat/completions
# Paths, revisions, and other defaults: checkpoint minutes config show.
# Keys are supplied through credentialFile, never as values in YAML.
