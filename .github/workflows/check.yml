name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Public documentation
        run: python3 scripts/public-content-check.py
      - name: Build UI and verify Go/Python
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/work" -w /work/web node:26.10.0-bookworm-slim@sha256:3ffc19ea878019d9e9ae8971732ad4a03cda44f167107173174b60ed7c65bed3 sh -c 'npm ci --ignore-scripts && npm run build'
          mkdir -p .dev/go .dev/go-build
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e GOPATH=/work/.dev/go -e GOCACHE=/work/.dev/go-build -v "$PWD:/work" -w /work golang:1.27.3-bookworm@sha256:dc0963f32053e4bc451d24d87e3892d42d01021b61f093e98eb95c0352bb84b0 sh -c 'go mod verify && go test -race ./... && go vet ./... && CGO_ENABLED=0 go build -trimpath ./cmd/checkpoint'
          python3 -m unittest discover -s scripts -p '*_test.py'
          git diff --exit-code
      - name: Signed bootstrap
        run: scripts/installer-smoke.sh
      - name: Native TLS and browser scenarios
        run: |
          scripts/build-native.sh
          scripts/native-smoke.sh
