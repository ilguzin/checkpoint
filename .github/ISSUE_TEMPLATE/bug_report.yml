name: Bug
description: Unexpected application or installer behavior
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Do not publish passwords, invitations, keys, or real meeting content. Report vulnerabilities through Security.
  - type: input
    id: version
    attributes:
      label: Checkpoint version
      description: Output of checkpoint version or the build commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Server OS, browser and device, Meeting/Webinar, regular network or VPN
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or screenshots
